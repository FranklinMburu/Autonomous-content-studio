<!doctype html><html><head><meta charset="utf-8"><title>Candela globe test</title>
<style>
@font-face{font-family:Inter;src:url(../reference/assets/fonts/InterVariable-latin.woff2) format('woff2');font-weight:100 900}
html,body{margin:0;background:#0B0B0F;color:#EDEFF5;font-family:Inter,system-ui}
.hero{position:relative;height:900px;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;font-size:11.5px;font-weight:600;white-space:nowrap;text-shadow:0 1px 8px #000}
.tag span{color:#6E7586;font-weight:500;margin-left:3px}.spacer{height:1400px}
</style></head><body>
<!-- Test page for kit/earth.js with LIVE data from GitHub (github-data.js + places.json). Serve this folder (python3 -m http.server) and open /design/kit/earth-demo.html. Scroll: the sun rises. -->
<section class="hero"><canvas id="c"></canvas><div id="tags"></div></section><div class="spacer"></div>
<script type="module">
import { createEarth, pickTags } from "./earth.js";
import { startSmoothScroll } from "./smooth-scroll.js";
startSmoothScroll();   // the portfolio scroll feel
import { createStudio, buildGlobe } from "./github-data.js";
const data = await (await fetch("../reference/assets/earth.json")).json();
const studio = createStudio();
const placeFile = await (await fetch("./places.json")).json();
const { stories, arcs } = buildGlobe(await studio.films(), await studio.topics(), placeFile);   // live, from GitHub
const tags = document.getElementById("tags");
const earth = createEarth(document.getElementById("c"), data, stories, { arcs, onPlace(places) {
  tags.innerHTML = pickTags(places, { width: innerWidth }).map(p => `<div class="tag" style="left:${p.left}px;top:${p.top}px">${p.n}<span>${p.year}</span></div>`).join("");
}});
const hero = document.querySelector(".hero");
addEventListener("scroll", () => earth.setProgress(scrollY / hero.offsetHeight), { passive: true });
window.__earth = earth;
</script></body></html>
