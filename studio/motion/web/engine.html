<!doctype html>
<html><head><meta charset="utf-8">
<!--
Motion engine (Tech Education style), v6 "one diagram, straight on" (11 Nov 2026).
One page draws one frame for any time t: render(t). Nothing is random at render time and nothing reads the clock, so the
same inputs always give the same video (studio/motion/render.js steps t).
Inputs (window.init): timing (word times), script (lines, key words, display map), plan (one scene per line, fixed scene
types), style (seeded accent and music). Docs: docs/MOTION_ENGINE.md

Visual grammar (taken from the reference, after Franklin rejected v5 as "weird" and "moving for the sake of moving"):
  1. Everything faces the viewer. One big subject at a time, large readable text, near-black background.
  2. The story is ONE diagram that stays on screen and changes in place (app -> line -> API door -> server). New things
     appear inside it (the request on the line opens into its URL, the answer opens into its data), never on top of it.
  3. The camera moves only to show what the voice is talking about: it pans to the part being named, follows a request
     down the line, pulls back to show a connection. Between those moves it holds still. No drift, no automatic angles.
  4. A frame at rest never cuts a panel in half (the framing guard), and the frame audit checks every settled frame.
-->
<style>

<body><div id="vp"><div id="world"></div></div><div id="fx"></div><div id="cap"></div>
<script>
"use strict";
// ============================================================ maths and timing
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eout = x => 1 - Math.pow(1 - clamp(x), 3);
const spring = x => { x = clamp(x); return 1 - Math.exp(-6.5 * x) * Math.cos(10 * x); };
const ramp = (t, a, d = .35) => ease((t - a) / d);
const win = (t, a, b, i = .3, o = .3) => Math.min(ramp(t, a, i), 1 - ramp(t, b, o));
const lerp = (a, b, k) => a + (b - a) * k;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let T, S, P, ST, L = [], LE = [], WD = [], DUR = 0, SC = [];
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9%.']/g, "");
// time of the first word of line i that starts with `w` (case and punctuation ignored); else a fraction into the line
function W(i, w, frac = 0.3) {
  const ws = WD[i] || [];
  if (w) { const n = norm(w); const hit = ws.find(x => norm(x.w).startsWith(n)); if (hit) return hit.start; }
  return lerp(L[i], LE[i], frac);
}

// ============================================================ objects in a flat world, seen straight on
const OBJ = {}, REST = {}, SIZE = {}, LIFE = {};
function mk(id, html) { const e = document.createElement("div"); e.className = "o"; e.id = id; e.innerHTML = `<div class="in">${html}</div>`; $("world").appendChild(e); OBJ[id] = e; return e; }
function mkLine(id, color, w = 4) { const e = document.createElement("div"); e.className = "ln"; e.id = id; e.style.background = color; e.style.height = w + "px"; e.style.marginTop = (-w / 2) + "px"; $("world").appendChild(e); OBJ[id] = e; e._line = true; return e; }
const at = (id, x, y) => { REST[id] = { x, y }; };
function measure() { for (const [id, e] of Object.entries(OBJ)) if (!e._line) { const el = e.firstElementChild; SIZE[id] = { w: el.offsetWidth, h: el.offsetHeight }; } }
let NOW = 0;
function put(id, o, dx = 0, dy = 0, s = 1, rot = 0) {
  const e = OBJ[id], r = REST[id]; if (!e || !r) return;
  e._o = o > 0.003 ? Math.min(1, o) : 0;
  if (e._o >= 0.9) { if (e._since == null || NOW < e._since) e._since = NOW; } else e._since = null;
  if (!(o > 0.003)) { e.style.display = "none"; return; }
  e.style.display = ""; e.style.opacity = Math.min(1, o).toFixed(3);
  e.style.transform = `translate(${(r.x + dx).toFixed(1)}px,${(r.y + dy).toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${s.toFixed(4)})`;
}
function line(id, o, x1, y1, x2, y2, k = 1) {
  const e = OBJ[id]; if (!e) return;
  if (!(o > 0.003) || k <= 0.001) { e.style.display = "none"; return; }
  const len = Math.hypot(x2 - x1, y2 - y1), a = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
  e.style.display = ""; e.style.opacity = o.toFixed(3); e.style.width = len.toFixed(1) + "px";
  e.style.transform = `translate(${x1.toFixed(1)}px,${y1.toFixed(1)}px) rotate(${a.toFixed(2)}deg) scaleX(${clamp(k).toFixed(4)})`;
}
const box = id => { const r = REST[id], z = SIZE[id]; return r && z ? { l: r.x - z.w / 2, r: r.x + z.w / 2, t: r.y - z.h / 2, b: r.y + z.h / 2 } : null; };

// ============================================================ the camera: a 2D pan and zoom, keyframed by intent
// The frame: captions own the top; the subject is fitted into FIT. A camera is {x, y, z}: the world point at the centre
// of FIT and the zoom. Every key has a reason (shown in info.json): the camera never moves without one.
const FIT = { l: 24, r: 516, t: 292, b: 928 }, CX = 270, CY = 610, SAFE = { l: 8, r: 532, t: 276, b: 950 };
const CK = [], CUTS = [], MOVES = [], CUES = [];
let CUR = null, CAM = { x: 0, y: 0, z: 1 }, CAMFORCE = null;
const cue = (t, kind, gain = 1) => CUES.push({ t: +Math.max(0, t).toFixed(3), kind, gain });
const lastKeyT = () => CK.length ? CK[CK.length - 1][0] : -1;
function moveTo(t, dur, c, why) {
  if (!c) return;
  if (!CUR) { CK.push([Math.max(0, t), c]); CUR = c; return; }
  if (Math.abs(c.x - CUR.x) < 2 && Math.abs(c.y - CUR.y) < 2 && Math.abs(c.z / CUR.z - 1) < 0.02) return;   // already there: hold
  t = Math.max(t, lastKeyT() + 0.001);
  CK.push([t, CUR], [t + dur, c]); CUR = c; MOVES.push({ t: +t.toFixed(2), why });
  if (dur >= 0.45) cue(t, "whoosh", 0.22);
}
function cutTo(t, c, why) {
  if (!CUR) { CK.push([Math.max(0, t), c]); CUR = c; return; }
  t = Math.max(t, lastKeyT() + 0.002);
  CK.push([t - 0.001, CUR], [t, c]); CUR = c; CUTS.push(t); MOVES.push({ t: +t.toFixed(2), why: "cut: " + why });
}
function camAt(t) {
  if (!CK.length) return { x: 0, y: 0, z: 1 };
  let i = 0; while (i < CK.length - 1 && CK[i + 1][0] <= t) i++;
  const a = CK[i], b = CK[Math.min(i + 1, CK.length - 1)];
  const k = b === a || t <= a[0] ? 0 : ease((t - a[0]) / (b[0] - a[0]));
  return { x: lerp(a[1].x, b[1].x, k), y: lerp(a[1].y, b[1].y, k), z: a[1].z * Math.pow(b[1].z / a[1].z, k) };
}
function moving(t) { for (let i = 0; i < CK.length - 1; i++) { const a = CK[i], b = CK[i + 1]; if (t > a[0] - 0.05 && t < b[0] + 0.12 && (a[1].x !== b[1].x || a[1].y !== b[1].y || a[1].z !== b[1].z)) return true; } return false; }
function applyCam(c) {
  CAM = c;
  $("world").style.transform = `scale(${c.z.toFixed(5)}) translate(${(-c.x).toFixed(2)}px,${(-c.y).toFixed(2)}px)`;
  const g = 44 * c.z;   // a faint dot grid fixed to the world, so every pan reads as a move across one surface
  $("vp").style.backgroundImage = `radial-gradient(circle,rgba(255,255,255,.07) ${Math.max(0.8, 1.3 * c.z).toFixed(2)}px,transparent ${Math.max(1, 1.6 * c.z).toFixed(2)}px)`;
  $("vp").style.backgroundSize = `${g.toFixed(2)}px ${g.toFixed(2)}px`;
  $("vp").style.backgroundPosition = `${(CX - c.x * c.z).toFixed(2)}px ${(CY - c.y * c.z).toFixed(2)}px`;
}

// The framing guard. fitShots() turns "show these things" into a camera: everything named is whole and inside FIT, as big
// as fits (up to zmax). If another solid panel that is alive during the shot would be cut by the frame edge, it is
// either pulled fully in (the frame widens) or the shot is recentred so it is fully out. A shot at rest never halves a panel.
function fitShots(ids, t0, t1, zmax = 1.25, pad = 18) {
  let set = ids.filter(id => box(id));
  if (!set.length) return null;
  const others = Object.keys(LIFE).filter(id => !set.includes(id) && box(id) && LIFE[id].some(([a, b]) => a < t1 && b > t0));
  let c = null;
  for (let it = 0; it < 8; it++) {
    const bs = set.map(box), U = { l: Math.min(...bs.map(b => b.l)), r: Math.max(...bs.map(b => b.r)), t: Math.min(...bs.map(b => b.t)), b: Math.max(...bs.map(b => b.b)) };
    const z = Math.min(zmax, (FIT.r - FIT.l) / (U.r - U.l + 2 * pad), (FIT.b - FIT.t) / (U.b - U.t + 2 * pad));
    c = { x: (U.l + U.r) / 2, y: (U.t + U.b) / 2, z };
    const V = { l: c.x - (CX - FIT.l) / z, r: c.x + (FIT.r - CX) / z, t: c.y - (CY - FIT.t) / z, b: c.y + (FIT.b - CY) / z };
    const cut = others.find(id => { const b = box(id); const inX = b.r > V.l && b.l < V.r, inY = b.b > V.t && b.t < V.b; return inX && inY && (b.l < V.l || b.r > V.r || b.t < V.t || b.b > V.b); });
    if (!cut) return c;
    set = set.concat(cut);
  }
  return c;
}

// ============================================================ captions (word by word, key words in the accent colour)
let groups = [], lastG = -1, KEYW = null;
function buildCaptions() {
  const disp = Object.entries(S.display || {}).map(([k, v]) => [k.split(/\s+/), v]);
  KEYW = new Set((S.key_words || []).map(norm));
  for (let li = 0; li < T.lines.length; li++) {
    const ws = WD[li], toks = [];
    for (let i = 0; i < ws.length; i++) {
      let hit = null;
      for (const [seq, show] of disp) if (seq.every((s, j) => ws[i + j] && norm(ws[i + j].w) === norm(s))) { hit = [seq.length, show + (ws[i + seq.length - 1].w.match(/[,.:?!]$/) || [""])[0]]; break; }
      if (hit) { toks.push({ w: hit[1], s: ws[i].start }); i += hit[0] - 1; } else toks.push({ w: ws[i].w, s: ws[i].start });
    }
    let g = [];
    toks.forEach((tk, i) => { g.push(tk); const end = /[,.:?!]$/.test(tk.w) && toks.length - i > 2; if ((g.length >= 5 && toks.length - i > 2) || end) { groups.push({ li, toks: g }); g = []; } });
    if (g.length) groups.push({ li, toks: g });
  }
  groups.forEach((g, i) => g.until = i + 1 < groups.length ? groups[i + 1].toks[0].s : 1e9);
}
function captions(t) {
  let gi = -1; for (let i = 0; i < groups.length; i++) if (groups[i].toks[0].s - 0.05 <= t) gi = i;
  const cap = $("cap");
  if (gi !== lastG) {
    cap.innerHTML = gi < 0 ? "" : `<div>${groups[gi].toks.map(k => { const bare = k.w.replace(/[,.:?!]$/, ""); return `<span class="${KEYW.has(norm(bare)) ? "k" : ""}">${esc(k.w.replace(/[,:]$/, ""))}</span>`; }).join(" ")}</div>`;
    lastG = gi;
  }
  if (gi < 0) return;
  const g = groups[gi], spans = cap.querySelectorAll("span"), lineEnd = LE[g.li];
  const fade = g.until > lineEnd + 0.3 ? 1 - ramp(t, lineEnd + 0.25, .2) : 1;
  g.toks.forEach((k, i) => { const a = clamp((t - k.s + 0.04) / 0.14), s = spring(a); spans[i].style.opacity = (Math.min(1, a * 1.5) * fade).toFixed(3); spans[i].style.transform = `translateY(${((1 - s) * 12).toFixed(1)}px)`; });
}

// ============================================================ the plan -> scenes; each kind of scene lives in a zone
// Zones are far apart in the world; changing zone is a hard cut (like the reference cutting to a statistic).
// Inside a zone the camera only pans and zooms.
const ZONE_OF = { hook_orbit: "hook", settings_field: "hook", stat_floor: "stat", stat_wall: "wall", cta_terminal: "cta", file_tree: "cta",
  end_card: "end", big_word: "free", bullets: "free" };       // every other type is part of the story diagram
const STORY_TYPES = ["laptop_prompt", "app_window", "diagram_link", "door", "packet", "code_card", "data_card", "question", "key_fly", "compare", "leak", "badges_intro", "badge"];
const DIAGRAM_TYPES = ["diagram_link", "door", "packet", "question", "key_fly", "leak", "badges_intro", "badge", "data_card", "code_card", "compare"];
const Z = {};
function layout() {
  SC = P.scenes.map((s, i) => ({ ...s, i, p: s.p || {}, t0: L[s.line], set: ZONE_OF[s.type] || "story" }));
  SC.forEach((s, i) => { s.t1 = i + 1 < SC.length ? SC[i + 1].t0 : DUR; s.zid = (s.set === "stat" || s.set === "wall") ? s.set + s.i : s.set; });
  let n = 0; for (const s of SC) if (!Z[s.zid]) Z[s.zid] = { x: 0, y: (n++) * 5000 };
}
const first = (type, after = -1) => SC.find(s => s.type === type && s.i > after);
const sceneAt = t => { let c = SC[0]; for (const s of SC) if (s.t0 - 0.001 <= t) c = s; return c; };
const zoneSpan = zid => { const ss = SC.filter(s => s.zid === zid); return ss.length ? [ss[0].t0, ss[ss.length - 1].t1] : null; };
const nextIn = (s, types) => SC.find(x => x.i > s.i && types.includes(x.type));

// ============================================================ build: one element per thing the plan names
const ICON = { key: `<svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>`,
  person: `<svg width="60%" height="60%" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.8-4.6 4.3-7 8.5-7s7.7 2.4 8.5 7z"/></svg>` };
function winHtml(title, body, w, cls = "") { return `<div class="win ${cls}" style="width:${w}px"><div class="bar"><i></i><i></i><i></i><b>${esc(title)}</b></div>${body}</div>`; }
const fs = (text, base, room, perChar = 0.6) => Math.max(11, Math.min(base, room / Math.max(1, String(text).length * perChar))).toFixed(1);
const BUILD = {
  hook_orbit(s) {
    const core = String(s.p.core || "");
    mk("core" + s.i, `<div style="width:210px;height:210px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:5px solid var(--acc);background:radial-gradient(circle at 50% 40%,rgba(var(--accRGB),.18),#111216 70%);box-shadow:0 0 70px rgba(var(--accRGB),.35);text-align:center;padding:16px"><div style="font:850 ${core.length > 5 ? Math.max(26, 200 / core.length) : 70}px/1 Inter;color:var(--acc);letter-spacing:-.03em">${esc(core)}</div>${s.p.sub ? `<div style="font:650 15px Inter;color:var(--tx2)">${esc(s.p.sub)}</div>` : ""}</div>`);
    (s.p.items || []).slice(0, 8).forEach((a, j) => {
      mk(`hi${s.i}_${j}`, `<div class="card" style="width:156px;padding:12px 14px;display:flex;align-items:center;gap:11px"><div style="width:38px;height:38px;flex:none;border-radius:10px;background:#25262d;display:flex;align-items:center;justify-content:center;font:700 20px Inter;color:var(--tx)">${esc(a.icon || "•")}</div><div style="font:650 17px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.label)}</div></div>`);
      mkLine(`hl${s.i}_${j}`, `rgba(var(--accRGB),.45)`, 3);
      mk(`hd${s.i}_${j}`, `<div style="width:11px;height:11px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px 3px rgba(var(--accRGB),.7)"></div>`);
    });
  },
  settings_field(s) {
    mk("set" + s.i, winHtml(s.p.title || "Settings", `<div style="padding:22px 22px 20px"><div class="lbl" style="margin-bottom:10px">${esc(s.p.label)}</div>
      <div class="kf" style="height:56px;border-radius:12px;border:2px solid rgba(255,255,255,.14);background:#0d0e12;display:flex;align-items:center;padding:0 15px;gap:12px;font:500 18px Inter;color:var(--tx3)">
      <span style="width:24px;height:24px;flex:none;color:var(--acc)">${ICON.key}</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.p.placeholder)}</span><span class="cur kc" style="background:var(--acc)"></span></div>
      <div style="display:flex;justify-content:flex-end;margin-top:18px"><div style="background:var(--tx);color:#111;border-radius:999px;padding:11px 22px;font:700 16px Inter">${esc(s.p.button || "Connect")}</div></div></div>`, 450));
  },
  stat_floor(s) {
    mk("sg" + s.i, `<div style="width:900px;height:420px;perspective:520px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent,#000 35%,#000 70%,transparent)"><div class="gr" style="width:1600px;height:1400px;margin-left:-350px;transform:rotateX(68deg);transform-origin:50% 0;background:repeating-linear-gradient(90deg,rgba(var(--accRGB),.35) 0 2px,transparent 2px 90px),repeating-linear-gradient(0deg,rgba(var(--accRGB),.28) 0 2px,transparent 2px 90px)"></div></div>`);
    statBlock("sn" + s.i, s, "var(--acc)", "var(--acc)");
  },
  stat_wall(s) {
    statBlock("wn" + s.i, s, "#fff", "var(--bad)");
    const rows = (s.p.rows || []).slice(0, 5);

// the story diagram: built once, then each scene changes it in place
let HAS_DIAGRAM = false;

  if (!first("app_window") && SC.some(s => STORY_TYPES.includes(s.type) && s.type !== "laptop_prompt"))
    BUILD.app_window({ i: -1, p: { title: "Your app", subtitle: "", rows: [], url: "localhost:5173" } });
  if (!HAS_DIAGRAM) return;
  const d = first("diagram_link") || { p: {} }, lk = first("leak");
  mk("server", `<div class="card" style="width:270px;padding:28px 20px 16px;display:flex;flex-direction:column;gap:10px">
    ${[0, 1].map(() => `<div style="height:26px;border-radius:7px;background:#0d0e12;display:flex;align-items:center;gap:8px;padding:0 11px"><i class="led" style="width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)"></i><i class="led" style="width:9px;height:9px;border-radius:50%;background:var(--acc)"></i><i style="flex:1;height:4px;background:#30333d;border-radius:3px"></i></div>`).join("")}

    ${lk ? `<div class="quota" style="margin-top:2px"><div style="display:flex;justify-content:space-between;font:600 13px Inter;color:var(--tx2)"><span>${esc(lk.p.meter_label || "Usage")}</span><span class="qv mono" style="color:var(--tx)">12%</span></div><div style="height:10px;border-radius:9px;background:#24262e;margin-top:7px;overflow:hidden"><div class="qb" style="height:100%;width:12%;border-radius:9px;background:var(--ok)"></div></div></div>` : ""}</div>`);
  mk("door", `<div id="doorIn" style="min-width:120px;height:54px;padding:0 20px;border-radius:14px;background:var(--acc);display:flex;align-items:center;justify-content:center;gap:8px;font:850 ${String(d.p.door || "API").length > 6 ? 18 : 26}px Inter;color:#1a1205;box-shadow:0 0 40px rgba(var(--accRGB),.55)">${esc(d.p.door || "API")}<span class="ok" style="display:none;font-size:22px">✓</span></div>`);

function build() {
  document.documentElement.style.setProperty("--acc", ST.accent); document.documentElement.style.setProperty("--accRGB", ST.accent_rgb.join(","));
  for (const s of SC) if (BUILD[s.type] && s.type !== "app_window") BUILD[s.type](s);
  const app = first("app_window"); if (app) BUILD.app_window(app);
  if (SC.some(s => STORY_TYPES.includes(s.type))) buildStory();
}

// ============================================================ place: where everything rests (measured sizes, fixed gaps)
// Story diagram, top to bottom (portrait suits a vertical flow): terminal (leaves when the app arrives) / app / the
// line with whatever is travelling on it / the API door on top of the server. Things that explain the line (the request's
// URL, the answer's data, the password comparison, strangers, status codes) open IN the gap on the line, never on a panel.
let G = {};
function place() {
  measure();
  for (const s of SC) { const o = Z[s.zid]; s.o = o; }
  // hook: the core with its apps around it; the settings panel below, far enough that a shot of one never halves the other
  for (const s of SC.filter(x => x.type === "hook_orbit")) {
    const o = s.o, items = (s.p.items || []).slice(0, 8), n = items.length;
    at("core" + s.i, o.x, o.y);
    items.forEach((_, j) => { const a = -Math.PI / 2 + j * 2 * Math.PI / Math.max(1, n), rx = n <= 4 ? 175 : 195, ry = n <= 4 ? 205 : 262;
      at(`hi${s.i}_${j}`, o.x + Math.cos(a) * rx, o.y + Math.sin(a) * ry); at(`hd${s.i}_${j}`, 0, 0); });
    s.hookBottom = Math.max(o.y + 105, ...items.map((_, j) => box(`hi${s.i}_${j}`).b));
  }
  for (const s of SC.filter(x => x.type === "settings_field")) {
    const h = SC.filter(x => x.type === "hook_orbit" && x.zid === s.zid).pop(), top = h ? h.hookBottom + 360 : s.o.y - SIZE["set" + s.i].h / 2;
    at("set" + s.i, s.o.x, top + SIZE["set" + s.i].h / 2);
  }
  for (const s of SC.filter(x => x.type === "stat_floor")) { at("sn" + s.i, s.o.x, s.o.y); at("sg" + s.i, s.o.x, s.o.y + SIZE["sn" + s.i].h / 2 + 120); }
  for (const s of SC.filter(x => x.type === "stat_wall")) { at("wn" + s.i, s.o.x, s.o.y); if (OBJ["wl" + s.i]) at("wl" + s.i, s.o.x, s.o.y + SIZE["wn" + s.i].h / 2 + 40 + SIZE["wl" + s.i].h / 2); }
  for (const s of SC.filter(x => x.type === "cta_terminal")) at("ct" + s.i, s.o.x, s.o.y);
  for (const s of SC.filter(x => x.type === "file_tree")) { const c = SC.filter(x => x.type === "cta_terminal" && x.zid === s.zid).pop(); at("ft" + s.i, s.o.x, c ? box("ct" + c.i).b + 40 + SIZE["ft" + s.i].h / 2 : s.o.y); }
  for (const s of SC.filter(x => x.type === "end_card")) { at("ea" + s.i, s.o.x, s.o.y - 170); at("eb" + s.i, s.o.x, s.o.y - 60); at("ec" + s.i, s.o.x, s.o.y + 110); }
  { let y = 0; for (const s of SC.filter(x => x.set === "free")) { s.fy = y; const o = s.o;
      if (s.type === "big_word") { at("bw" + s.i, o.x, o.y + y); y += SIZE["bw" + s.i].h + 520; }
      else { let yy = y; (s.p.items || []).slice(0, 4).forEach((_, j) => { const id = `bl${s.i}_${j}`; at(id, o.x, o.y + yy + SIZE[id].h / 2); yy += SIZE[id].h + 18; }); y = yy + 520; } } }
  // the story
  if (!OBJ.app && !OBJ.term) return;
  const o = Z.story, aH = OBJ.app ? SIZE.app.h : 0;
  if (OBJ.app) at("app", o.x, o.y);
  if (OBJ.term) at("term", o.x, o.y - aH / 2 - 340 - SIZE.term.h / 2);
  if (!HAS_DIAGRAM) return;
  const appB = o.y + aH / 2, LINE = 262, doorY = appB + LINE + 27, srvH = SIZE.server.h;
  at("door", o.x, doorY); at("server", o.x, doorY + srvH / 2 - 6);
  at("nodeA", o.x, appB + 12); at("nodeB", o.x, doorY - 39);
  G = { x: o.x, top: appB + 12, bot: doorY - 39, mid: (appB + doorY - 27) / 2, appB, doorY };
  for (const s of SC) {
    const id = { packet: "pk", code_card: "cc", data_card: "dc", badge: "bd" }[s.type];
    if (s.type === "packet") at("pk" + s.i, o.x, G.mid);
    if (s.type === "code_card" || s.type === "data_card") at(id + s.i, o.x, G.mid);
    if (s.type === "data_card" && OBJ["dv" + s.i]) at("dv" + s.i, o.x, G.mid);
    if (s.type === "question") { at("hq" + s.i, o.x, G.bot - 30); at("qm" + s.i, o.x + SIZE["hq" + s.i].w / 2 + 52, G.bot - 64); }
    if (s.type === "key_fly") at("ky" + s.i, o.x, G.bot - 30);
    if (s.type === "compare") { at("cA" + s.i, o.x - 130, G.mid); at("cB" + s.i, o.x + 130, G.mid); at("cE" + s.i, o.x, G.mid); }
    if (s.type === "leak") for (let j = 0; j < 6; j++) { const side = j % 2 ? 1 : -1, row = Math.floor(j / 2); at(`av${s.i}_${j}`, o.x + side * (row === 1 ? 205 : 128), G.mid + (row - 1) * 74 - 10); at(`lk${s.i}_${j}`, o.x, G.bot - 30); at(`rd${s.i}_${j}`, 0, 0); }
    if (s.type === "badges_intro") at("bi" + s.i, o.x, G.mid);
    if (s.type === "badge") { const n = SC.filter(x => x.type === "badge" && x.i < s.i).length % 3; at("bd" + s.i, o.x + (n - 1) * 160, G.mid); at("br" + s.i, o.x, G.mid); }
  }
}

// ============================================================ lifetimes (when each solid panel is on screen)
// Used by the framing guard (what else is alive during a shot) and the frame audit.
function lives() {
  const add = (id, a, b) => { if (OBJ[id] && b > a) (LIFE[id] = LIFE[id] || []).push([a, b]); };
  const zs = zid => zoneSpan(zid) || [0, 0];
  for (const s of SC) {
    const t0 = s.t0, t1 = s.t1, i = s.i;
    switch (s.type) {
      case "hook_orbit": { const z = zs(s.zid); add("core" + i, t0, z[1]); (s.p.items || []).slice(0, 8).forEach((_, j) => add(`hi${i}_${j}`, t0 + 0.4 + j * 0.07, z[1])); break; }
      case "settings_field": add("set" + i, t0 - 0.3, zs(s.zid)[1]); break;
      case "stat_floor": add("sn" + i, t0, t1); break;
      case "stat_wall": add("wn" + i, t0, t1); add("wl" + i, t0, t1); break;
      case "cta_terminal": add("ct" + i, t0, zs(s.zid)[1]); break;
      case "file_tree": add("ft" + i, t0, zs(s.zid)[1]); break;
      case "end_card": add("ea" + i, t0, DUR); add("eb" + i, t0, DUR); add("ec" + i, t0, DUR); break;
      case "big_word": add("bw" + i, t0, t1); break;
      case "bullets": (s.p.items || []).slice(0, 4).forEach((_, j) => add(`bl${i}_${j}`, t0, t1)); break;
      case "code_card": add("cc" + i, t0 - 0.1, gapEnd(s)); break;
      case "data_card": add("dc" + i, t0 - 0.1, gapEnd(s)); break;
      case "compare": add("cA" + i, t0, gapEnd(s)); add("cB" + i, t0, gapEnd(s)); break;
      case "badge": add("bd" + i, t0 - 0.2, badgesEnd()); break;
      case "leak": for (let j = 0; j < 6; j++) add(`av${i}_${j}`, t0, gapEnd(s)); break;
    }
  }
  const sp = zoneSpan("story");
  if (sp) {
    const lap = first("laptop_prompt"), app = first("app_window");
    if (OBJ.term && lap) add("term", lap.t0 - 0.1, termEnd());
    if (OBJ.app) add("app", appStart(), sp[1]);
    if (HAS_DIAGRAM) { const d = diagramStart(); add("server", d, sp[1]); add("door", doorAt(), sp[1]); }

    if (s.type === "question") {
      const until = (nextIn(s, ["badges_intro", "badge", "packet", "data_card", "code_card"]) || { t0: (zoneSpan("story") || [0, DUR])[1] }).t0, a = W(s.line, s.p.word, 0.6);
      const lv = win(t, s.t0 - 0.05, until, .2, .2), k = ease((t - s.t0) / 0.7);
      put("hq" + i, lv, 0, lerp(G.top + 24 - REST["hq" + i].y, 0, k), 1);
      const kf = first("key_fly", i), keyed = kf && t > W(kf.line, kf.p.word, 0.4) + 0.35;
      q("hq" + i, ".kk").style.display = keyed ? "inline-block" : "none";
      put("qm" + i, lv * win(t, a - 0.05, keyed ? W(kf.line, kf.p.word, 0.4) + 0.35 : until, .15, .15), 0, -6 * Math.abs(Math.sin((t - a) * 3)), 0.4 + 0.6 * spring((t - a) / .45));
      if (keyed) doorOk = Math.max(doorOk, lv);
    }
    if (s.type === "key_fly") { const a = W(s.line, s.p.word, 0.4), k = ease((t - a + 0.25) / 0.6);
      put("ky" + i, t > a - 0.25 && t < a + 0.38 ? 1 : 0, lerp(-260, -60, k), lerp(-140, 0, k) - 50 * Math.sin(Math.PI * k), lerp(1.2, 0.5, k), lerp(-90, 0, k)); }
    if (s.type === "compare") { const k = spring((t - s.t0 + 0.05) / 0.6), k2 = spring((t - s.t0 - 0.15) / 0.6);
      put("cA" + i, live("cA" + i, t), -(1 - k) * 60, 0); put("cB" + i, live("cB" + i, t) * ramp(t, s.t0 + 0.15, .2), (1 - k2) * 60, 0, 1 + 0.04 * Math.max(0, Math.sin((t - s.t0 - 0.6) * 6)) * ramp(t, s.t0 + 0.6, .2));
      put("cE" + i, live("cA" + i, t) * ramp(t, s.t0 + 0.35, .2), 0, 0, spring((t - s.t0 - 0.35) / .5)); }
    if (s.type === "leak") {
      const a = W(s.line, s.p.word, 0.4), mw = W(s.line, s.p.meter_word, 0.6);
      for (let j = 0; j < 6; j++) {
        const id = `av${i}_${j}`, r = REST[id], ak = spring((t - s.t0 - j * 0.06) / 0.5), lv = live(id, t) * clamp((t - s.t0 - j * 0.06) * 6);
        put(id, lv, 0, 0, 0.4 + 0.6 * ak);
        const kf = ease((t - a - j * 0.06) / 0.5), from = REST[`lk${i}_${j}`];   // a copy of the key flies to each stranger
        put(`lk${i}_${j}`, lv * (kf > 0 && kf < 1 ? 1 : 0), lerp(0, r.x - from.x, kf), lerp(0, r.y - from.y - 30, kf) - 40 * Math.sin(Math.PI * kf), 1, t * 300 + j * 50);
        const p = ((t - a - 0.6 - j * 0.11) * 1.4) % 1, go = t > a + 0.6 + j * 0.11;   // ...and they all send requests to the door
        REST[`rd${i}_${j}`] = { x: lerp(r.x, G.x, p), y: lerp(r.y, G.bot - 10, p) }; put(`rd${i}_${j}`, go ? lv * Math.sin(Math.PI * p) : 0);
      }
      const qq = t < s.t0 ? 12 : Math.round(12 + 85 * ease((t - mw) / 1.0)), qv = q("server", ".qv"), qb = q("server", ".qb");
      if (qv) { qv.textContent = qq + "%"; qb.style.width = qq + "%"; qb.style.background = qq > 80 ? "var(--bad)" : qq > 50 ? "var(--warn)" : "var(--ok)"; qb.style.boxShadow = qq > 80 ? "0 0 16px rgba(248,81,73,.8)" : "none"; }
    }
    if (s.type === "badge") {
      const r = REST["bd" + i], k = ease((t - s.t0 - 0.05) / 0.4), y = pos(1 - k) - G.mid;     // the answer travels up from the door, then becomes its code
      put("br" + i, t > s.t0 - 0.02 && k < 1 ? 1 : 0, lerp(0, r.x - G.x, k * k), y);
      const pop = spring((t - s.t0 - 0.42) / 0.5); put("bd" + i, t > s.t0 + 0.4 ? live("bd" + i, t) : 0, 0, 0, 0.5 + 0.5 * pop);
    }
    if (s.type === "badges_intro") { const k = ease((t - s.t0 - 0.3) / Math.max(0.6, s.t1 - s.t0 - 0.6)); put("bi" + i, win(t, s.t0 + 0.2, s.t1 - 0.05, .2, .2), 0, pos(1 - k) - G.mid); }
  }
  const di = $("doorIn"); if (di) { di.querySelector(".ok").style.display = doorOk > 0.5 ? "inline" : "none"; di.style.boxShadow = `0 0 ${(40 + 30 * doorOk).toFixed(0)}px rgba(${doorOk > 0.5 ? "63,185,80" : ST.accent_rgb},.6)`; }
}

// ============================================================ the frame audit
// After direction, step through the video and list every settled frame where a solid panel is cut by the frame edge,
// runs under the captions, or overlaps another solid panel. The pipeline holds the video if the list is not empty.
const SETTLE = 0.45;
const SOLID = /^(core|hi|set|sn|wn|wl|term|app|server|cc|dc|cA|cB|bd|av|ct|ft|eb|ec|bw|bl)\d*(_\d+)?$|^(term|app|server)$/;
function subjects(s) {
  const i = s.i;
  switch (s.type) {
    case "hook_orbit": return ["core" + i].concat((s.p.items || []).slice(0, 8).map((_, j) => `hi${i}_${j}`));
    case "settings_field": return ["set" + i];
    case "stat_floor": return ["sn" + i];
    case "stat_wall": return ["wn" + i];
    case "laptop_prompt": return ["term"];
    case "app_window": return ["app"];
    case "door": case "question": case "key_fly": return ["server", "door"];
    case "code_card": return ["cc" + i];
    case "data_card": return ["dc" + i];
    case "compare": return ["cA" + i, "cB" + i];
    case "badge": return ["bd" + i];
    case "cta_terminal": return ["ct" + i];
    case "file_tree": return ["ft" + i];
    case "end_card": return ["eb" + i, "ec" + i];
    case "big_word": return ["bw" + i];
    case "bullets": return (s.p.items || []).slice(0, 4).map((_, j) => `bl${i}_${j}`);
  }
  return [];
}
function screenBox(id) {
  const e = OBJ[id]; if (!e || !e._o || e._o < 0.9 || e._since == null || NOW - e._since < SETTLE - 0.01) return null;
  const r = e.firstElementChild.firstElementChild.getBoundingClientRect(); if (r.width < 2 || r.height < 2) return null;
  return { id, l: r.left, r: r.right, t: r.top, b: r.bottom };
}
function look(t) { render(Math.max(0, t - SETTLE)); render(t); }
function audit() {
  const out = {}, add = (key, t, what, px) => { if (!out[key] || px > out[key].px) out[key] = { t: +t.toFixed(2), what, px: Math.round(px) }; };
  for (let t = 0.4; t < DUR - 0.15; t += 0.2) {
    if (moving(t)) continue;                    // only frames at rest: during a move the frame is travelling on purpose
    const sc = sceneAt(t); look(t);
    if (t <= sc.t1 - 0.2) for (const id of subjects(sc)) { const x = screenBox(id); if (!x) continue;
      const over = Math.max(SAFE.l - x.l, x.r - SAFE.r, SAFE.t - x.t, x.b - SAFE.b);
      if (over > 6) add("cut:" + id, t, `${id} is cut off by the ${SAFE.t - x.t === over ? "caption area" : "screen edge"} (${sc.type})`, over); }
    const solid = Object.keys(OBJ).filter(id => SOLID.test(id)).map(screenBox).filter(x => x && x.r > 0 && x.l < 540 && x.b > 0 && x.t < 960);
    for (const x of solid) {
      const w = x.r - x.l, h = x.b - x.t, outX = Math.max(0 - x.l, x.r - 540, 0), outB = Math.max(x.b - 960, 0), cap = x.t < SAFE.t - 8 && x.b > SAFE.t + 6 ? SAFE.t - x.t : 0;
      if (x.r < 0 || x.l > 540 || x.b < SAFE.t - 30 || x.t > 960) continue;
      if (outX > 0.04 * w || outB > 0.04 * h) add("edge:" + x.id, t, `${x.id} is cut off by the screen edge (${sc.type})`, Math.max(outX, outB));
      if (cap > 0.04 * h) add("cap:" + x.id, t, `${x.id} runs under the captions (${sc.type})`, cap);
    }
    for (let i = 0; i < solid.length; i++) for (let j = i + 1; j < solid.length; j++) {
      const p = solid[i], q_ = solid[j], w = Math.min(p.r, q_.r) - Math.max(p.l, q_.l), h = Math.min(p.b, q_.b) - Math.max(p.t, q_.t);
      if (w <= 0 || h <= 0) continue;
      const share = w * h / Math.min((p.r - p.l) * (p.b - p.t), (q_.r - q_.l) * (q_.b - q_.t));
      if (share > 0.04) add(`over:${p.id}+${q_.id}`, t, `${p.id} and ${q_.id} overlap (${sc.type})`, share * 100);
    }
  }
  return Object.values(out).sort((a, b) => a.t - b.t);
}

window.init = function (data) {
  T = data.timing; S = data.script; P = data.plan; ST = data.style;
  L = T.lines.map(l => l.start); LE = T.lines.map(l => l.end); DUR = T.duration;
  WD = T.lines.map((_, i) => T.words.filter(w => w.line === i));
  layout(); build(); buildCaptions(); place(); lives(); direct(); render(0);
  const problems = audit();
  for (const e of Object.values(OBJ)) e._since = null;
  render(0);
  return { duration: DUR, cues: CUES, sections: sections(), cuts: CUTS.length, moves: MOVES, set_changes: new Set(SC.map(s => s.zid)).size - 1, audit: problems };
};
// music arrangement, read by the mixer (studio/motion/sound.py)
function sections() {
  const t = type => (first(type) || {}).t0, leak = first("leak"), wall = first("stat_wall"), cta = first("cta_terminal") || first("file_tree"), end = first("end_card");
  const groove = Math.min(...SC.filter(s => s.set !== "hook").map(s => s.t0).concat([DUR]));
  return { groove_from: groove, kick_from: Math.min(t("stat_floor") ?? groove, groove), break_from: leak ? leak.t0 : null, break_to: leak ? (wall ? wall.t0 + 0.6 : leak.t1) : null,
    impact: wall ? wall.t0 + 0.6 : null, calm_from: cta ? cta.t0 : (end ? end.t0 : DUR), end_from: end ? end.t0 : DUR };
}
window.render = render;
