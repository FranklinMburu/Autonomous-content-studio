<!doctype html>
<html><head><meta charset="utf-8">
<!--
Motion engine (Tech Education style). One page draws one frame for any time t: render(t). Nothing is random at render
time and nothing depends on the clock, so the same inputs always give the same video (studio/motion/render.js steps t).
Inputs (window.init): timing (word times from the narration), script (lines, key words, display map), plan (one scene
per line, from the fixed scene types below), style (seeded: accent colour, camera variation). Docs: docs/MOTION_ENGINE.md
-->
<style>
@font-face{font-family:Inter;font-weight:400;src:url(../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(../node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
@font-face{font-family:Inter;font-weight:900;src:url(../node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2)}
@font-face{font-family:JBM;font-weight:400;src:url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2)}
@font-face{font-family:JBM;font-weight:700;src:url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2)}
:root{--bg:#09090C;--acc:#F5A524;--accRGB:245,165,36;--tx:#F4F6FB;--tx2:#C6CBD8;--tx3:#8A91A3;--line:rgba(255,255,255,.13);--ok:#3FB950;--bad:#F85149;--warn:#F5A524}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
#vp{position:absolute;inset:0;overflow:hidden;perspective:900px;perspective-origin:50% 60%;background:radial-gradient(110% 75% at 50% 40%,#241f28 0%,#131217 45%,var(--bg) 80%)}
#world{position:absolute;left:50%;top:60%;width:0;height:0;transform-style:preserve-3d}
.o{position:absolute;left:0;top:0;transform-style:preserve-3d;backface-visibility:hidden}
.in{transform:translate(-50%,-50%);transform-style:preserve-3d}
#cap{position:absolute;left:24px;right:24px;top:112px;display:flex;justify-content:center;text-align:center;font:650 32px/1.2 Inter;letter-spacing:-.025em;z-index:10;text-shadow:0 2px 18px rgba(0,0,0,.85)}
#cap span{display:inline-block;margin:0 .12em;opacity:0}
#cap span.k{color:var(--acc);font-weight:800;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
#fx{position:absolute;inset:0;pointer-events:none;z-index:9;background:linear-gradient(180deg,rgba(9,9,12,1) 0,rgba(9,9,12,1) 236px,rgba(9,9,12,0) 286px),radial-gradient(130% 80% at 50% 55%,transparent 55%,rgba(0,0,0,.55) 100%)}
#grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;z-index:11;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:12;pointer-events:none;mix-blend-mode:overlay}
.win{background:linear-gradient(180deg,#2b2e3a,#1d1f28);border:1px solid rgba(255,255,255,.26);border-radius:16px;box-shadow:0 40px 90px rgba(0,0,0,.65);overflow:hidden;position:relative}
.win:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,var(--sheen,0)) 48%,transparent 62%);background-size:300% 100%;background-position:var(--sx,120%) 0;pointer-events:none}
.bar{height:32px;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line);font:500 12px Inter;color:var(--tx3)}
.bar i{width:10px;height:10px;border-radius:50%}
.bar i:nth-child(1){background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.bar b{flex:1;text-align:center;font-weight:500;margin-right:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.p{color:var(--acc)}
.cur{display:inline-block;width:9px;height:18px;background:var(--tx);vertical-align:-3px;margin-left:1px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 18px;border-top:1px solid var(--line);font:500 16px Inter;color:var(--tx2)}
.row b{color:var(--tx);font-weight:600;text-align:right}
.lbl{font:700 11px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 16px;font:700 16px JBM;white-space:nowrap}
.mono{font-family:JBM}
.card{border-radius:16px;background:linear-gradient(180deg,#2c2f3b,#1e2029);border:1px solid rgba(255,255,255,.26);box-shadow:0 30px 70px rgba(0,0,0,.6)}
</style></head>
<body><div id="vp"><div id="world"></div></div><div id="fx"></div><div id="cap"></div><canvas id="grain" width="270" height="480" style="width:540px;height:960px"></canvas><div id="flash"></div>
<script>
"use strict";
// ============================================================ maths
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eout = x => 1 - Math.pow(1 - clamp(x), 3);
const spring = x => { x = clamp(x); return 1 - Math.exp(-6.5 * x) * Math.cos(10 * x); };
const ramp = (t, a, d = .45) => ease((t - a) / d);
const win = (t, a, b, i = .35, o = .35) => Math.min(ramp(t, a, i), 1 - ramp(t, b, o));
const lerp = (a, b, k) => a + (b - a) * k;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let T, S, P, ST, L = [], LE = [], WD = [], DUR = 0, SC = [];
// first word of line i whose text starts with `w` (case/punctuation ignored); else a fraction into the line
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9%.']/g, "");
function W(i, w, frac = 0.3) {
  const ws = WD[i] || []; if (typeof w === "number") return ws[Math.min(w, ws.length - 1)] ? ws[Math.min(w, ws.length - 1)].start : L[i];
  if (w) { const n = norm(w); const hit = ws.find(x => norm(x.w).startsWith(n)); if (hit) return hit.start; }
  return lerp(L[i], LE[i], frac);
}
const WE = i => (WD[i] && WD[i].length ? WD[i][WD[i].length - 1].end : LE[i]);

// ============================================================ objects and camera
const OBJ = {};
function mk(id, html) { const e = document.createElement("div"); e.className = "o"; e.id = id; e.innerHTML = `<div class="in">${html}</div>`; $("world").appendChild(e); OBJ[id] = e; return e; }
function put(id, o, x, y, z, ry = 0, rx = 0, rz = 0, s = 1, blur = 0) {
  const e = OBJ[id]; if (!e) return;
  e._o = o > 0.003 ? Math.min(1, o) : 0;
  if (e._o >= 0.9) { if (e._since == null || NOW < e._since) e._since = NOW; } else e._since = null;   // opaque since when (frame audit)
  if (!(o > 0.003)) { e.style.display = "none"; return; }
  e.style.display = ""; e.style.opacity = Math.min(1, o).toFixed(3);
  e.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,${z.toFixed(1)}px) rotateY(${ry.toFixed(2)}deg) rotateX(${rx.toFixed(2)}deg) rotateZ(${rz.toFixed(2)}deg) scale(${s.toFixed(4)})`;
  e.style.filter = blur > 0.15 ? `blur(${blur.toFixed(2)}px)` : "";
}
let CAM = { x: 0, y: 0, z: 0, yaw: 0, pitch: 0, roll: 0, D: 900, P: 900 }, NOW = 0;
const CK = [], CUTS = [], CUES = [];
const key = (t, c) => CK.push([t, c]);
function cut(tc, a, b) { key(tc - 0.001, a); key(tc, b); CUTS.push(tc); }
const cue = (t, kind, gain = 1) => CUES.push({ t: +Math.max(0, t).toFixed(3), kind, gain });
function camBase(t) {
  let i = 0; while (i < CK.length - 1 && CK[i + 1][0] <= t) i++;
  const a = CK[i], b = CK[Math.min(i + 1, CK.length - 1)];
  const k = b === a || t <= a[0] ? 0 : ease((t - a[0]) / (b[0] - a[0]));
  const c = {}; for (const p of ["x", "y", "z", "yaw", "pitch", "roll", "D", "P"]) c[p] = lerp(a[1][p], b[1][p], k);
  return c;
}
function camAt(t) {
  const c = camBase(t), d = ST.drift;   // never still: a slow handheld drift, its phases come from the seed
  c.yaw += 2.4 * Math.sin(t * 0.52 + d[0]) + 0.8 * Math.sin(t * 1.21 + d[1]); c.pitch += 1.0 * Math.sin(t * 0.61 + d[2]); c.roll += 0.5 * Math.sin(t * 0.37 + d[3]);
  c.x += 6 * Math.sin(t * 0.83 + d[1]); c.y += 5 * Math.sin(t * 0.71 + d[2]);
  return c;
}
function applyCam(c, shake) {
  CAM = c;
  const sx = shake * Math.sin(NOW * 91) * 6, sy = shake * Math.cos(NOW * 77) * 6;
  $("vp").style.perspective = c.P.toFixed(1) + "px";
  $("world").style.transform = `translate(${sx}px,${sy}px) translateZ(${(c.P - c.D).toFixed(1)}px) rotateZ(${c.roll.toFixed(2)}deg) rotateX(${(-c.pitch).toFixed(2)}deg) rotateY(${(-c.yaw).toFixed(2)}deg) translate3d(${(-c.x).toFixed(1)}px,${(-c.y).toFixed(1)}px,${(-c.z).toFixed(1)}px)`;
}
function depth(x, y, z) {
  const c = CAM, dx = x - c.x, dy = y - c.y, dz = z - c.z, yw = -c.yaw * Math.PI / 180, pt = -c.pitch * Math.PI / 180;
  const z1 = -dx * Math.sin(yw) + dz * Math.cos(yw), z2 = dy * Math.sin(pt) + z1 * Math.cos(pt);
  return c.D - z2;
}
const dof = (x, y, z, amt = 1) => amt * clamp(Math.abs(depth(x, y, z) - CAM.D) / 260 * 2.2, 0, 5);
const cam = (o, dx, dy, dz, yaw, pitch, D, P = 900, roll = 0) => ({ x: o.x + dx, y: o.y + dy, z: o.z + dz, yaw, pitch, roll, D, P });

// ============================================================ captions
let groups = [], lastG = -1, KEYW = null;
function buildCaptions() {
  const disp = Object.entries(S.display || {}).map(([k, v]) => [k.split(/\s+/), v]);
  KEYW = new Set((S.key_words || []).map(norm));
  for (let li = 0; li < T.lines.length; li++) {
    const ws = WD[li], toks = [];
    for (let i = 0; i < ws.length; i++) {
      let hit = null;
      for (const [seq, show] of disp) if (seq.every((s, j) => ws[i + j] && norm(ws[i + j].w) === norm(s))) { hit = [seq.length, show + (ws[i + seq.length - 1].w.match(/[,.:?!]$/) || [""])[0]]; break; }
      if (hit) { toks.push({ w: hit[1], s: ws[i].start }); i += hit[0] - 1; } else toks.push({ w: ws[i].w, s: ws[i].start });
    }
    let g = [];
    toks.forEach((tk, i) => { g.push(tk); const end = /[,.:?!]$/.test(tk.w) && toks.length - i > 2; if ((g.length >= 5 && toks.length - i > 2) || end) { groups.push({ li, toks: g }); g = []; } });
    if (g.length) groups.push({ li, toks: g });
  }
  groups.forEach((g, i) => g.until = i + 1 < groups.length ? groups[i + 1].toks[0].s : 1e9);
}
function captions(t) {
  let gi = -1; for (let i = 0; i < groups.length; i++) if (groups[i].toks[0].s - 0.05 <= t) gi = i;
  const cap = $("cap");
  if (gi !== lastG) {
    cap.innerHTML = gi < 0 ? "" : `<div>${groups[gi].toks.map(k => { const bare = k.w.replace(/[,.:?!]$/, ""); return `<span class="${KEYW.has(norm(bare)) ? "k" : ""}">${esc(k.w.replace(/[,:]$/, ""))}</span>`; }).join(" ")}</div>`;
    lastG = gi;
  }
  if (gi < 0) return;
  const g = groups[gi], spans = cap.querySelectorAll("span"), lineEnd = LE[g.li];
  const fade = g.until > lineEnd + 0.3 ? 1 - ramp(t, lineEnd + 0.25, .2) : 1;
  g.toks.forEach((k, i) => { const a = clamp((t - k.s + 0.04) / 0.14), s = spring(a); spans[i].style.opacity = (Math.min(1, a * 1.5) * fade).toFixed(3); spans[i].style.transform = `translateY(${((1 - s) * 14).toFixed(1)}px) scale(${(0.86 + 0.14 * s).toFixed(3)})`; });
}

// ============================================================ the plan -> scenes on a timeline, sets in space
const SET_OF = { hook_orbit: "hook", settings_field: "hook", stat_floor: "stat", stat_wall: "wall", cta_terminal: "cta", file_tree: "cta",
  end_card: "end", big_word: "free", bullets: "free" };      // every other type plays in the "story" set (the growing diagram)
const STORY_TYPES = ["laptop_prompt", "app_window", "diagram_link", "door", "packet", "code_card", "data_card", "question", "key_fly", "compare", "leak", "badges_intro", "badge"];
const POS = {};
function layout() {
  SC = P.scenes.map((s, i) => ({ ...s, i, p: s.p || {}, t0: L[s.line], set: SET_OF[s.type] || "story" }));
  SC.forEach((s, i) => { s.t1 = i + 1 < SC.length ? SC[i + 1].t0 : DUR; });
  // each new set gets its own place in the world, further along the path (x varies with the seed)
  let z = 0, n = 0;
  SC.forEach(s => {
    const id = s.set === "stat" || s.set === "free" ? `${s.set}${s.i}` : s.set; s.sid = id;
    if (POS[id]) return;
    if (s.set === "wall") { const st = POS.story || { x: 0, y: 0, z: z - 2800 }; POS[id] = { x: st.x + 1500, y: 0, z: st.z - 400 }; return; }
    POS[id] = { x: n === 0 ? 0 : Math.round((ST.r(n) - 0.5) * 700), y: 0, z }; z -= 2900; n++;
  });
}
const first = (type, after = -1) => SC.find(s => s.type === type && s.i > after);
const sceneAt = t => { let c = SC[0]; for (const s of SC) if (s.t0 - 0.001 <= t) c = s; return c; };

// ============================================================ build the elements the plan needs
const ICON = { key: `<svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>` };
function winHtml(title, body, w, extra = "") { return `<div class="win" style="width:${w}px;${extra}"><div class="bar"><i></i><i></i><i></i><b>${esc(title)}</b></div>${body}</div>`; }
function build() {
  const accRGB = ST.accent_rgb.join(",");
  document.documentElement.style.setProperty("--acc", ST.accent); document.documentElement.style.setProperty("--accRGB", accRGB);
  // glows and lit floors under every set
  for (const [id, o] of Object.entries(POS)) {
    const c = id === "wall" ? "248,81,73" : id === "story" ? ST.cool_rgb.join(",") : accRGB;
    mk("g_" + id, `<div style="width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle,rgba(${c},.26) 0%,rgba(${c},.09) 40%,rgba(${c},0) 70%)"></div>`);
    mk("f_" + id, `<div style="width:3000px;height:3000px;background:repeating-linear-gradient(90deg,rgba(${accRGB},.42) 0 3px,transparent 3px 120px),repeating-linear-gradient(0deg,rgba(${accRGB},.30) 0 3px,transparent 3px 120px);-webkit-mask-image:radial-gradient(50% 50% at 50% 50%,#000 25%,transparent 72%)"></div>`);
  }
  for (let i = 0; i < 46; i++) mk("st" + i, `<div style="width:9px;height:${150 + (i * 53) % 160}px;border-radius:6px;background:linear-gradient(180deg,rgba(255,214,150,0),rgba(255,214,150,.95));box-shadow:0 0 16px rgba(${accRGB},.7)"></div>`);
  for (const s of SC) BUILD[s.type] && BUILD[s.type](s);
  if (SC.some(s => STORY_TYPES.includes(s.type))) buildStory();
}
const BUILD = {
  hook_orbit(s) {
    mk("core" + s.i, `<div class="card" style="width:190px;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-color:rgba(var(--accRGB),.6);box-shadow:0 0 90px rgba(var(--accRGB),.35),inset 0 0 40px rgba(var(--accRGB),.12);background:radial-gradient(circle at 50% 40%,#2a1d08,#141016);padding:10px;text-align:center"><div style="font:800 ${String(s.p.core || "").length > 5 ? 34 : 56}px/1 Inter;color:var(--acc);letter-spacing:-.03em">${esc(s.p.core)}</div><div class="lbl" style="color:var(--tx2)">${esc(s.p.sub || "")}</div></div>`);
    (s.p.items || []).slice(0, 8).forEach((a, j) => mk(`ap${s.i}_${j}`, `<div class="card" style="width:170px;padding:14px 16px;display:flex;align-items:center;gap:12px"><div style="width:42px;height:42px;border-radius:11px;background:#22242d;display:flex;align-items:center;justify-content:center;font:700 22px Inter">${esc(a.icon || "•")}</div><div style="font:650 17px Inter">${esc(a.label)}</div></div>`));
    for (let j = 0; j < 24; j++) mk(`pt${s.i}_${j}`, `<div style="width:10px;height:10px;border-radius:50%;background:#FFD596;box-shadow:0 0 14px 4px rgba(var(--accRGB),.7)"></div>`);
  },
  settings_field(s) {
    mk("set" + s.i, winHtml(s.p.title || "Settings", `<div style="padding:20px"><div class="lbl" style="margin-bottom:9px">${esc(s.p.label)}</div>
      <div class="kf" style="height:50px;border-radius:11px;border:1.5px solid rgba(255,255,255,.14);background:#0c0d11;display:flex;align-items:center;padding:0 14px;gap:11px;font:500 16px Inter;color:var(--tx3)">
      <span style="width:22px;height:22px;color:var(--acc)">${ICON.key}</span><span>${esc(s.p.placeholder)}</span><span class="cur kc" style="background:var(--acc)"></span></div>
      <div style="display:flex;justify-content:flex-end;margin-top:16px"><div style="background:var(--tx);color:#111;border-radius:999px;padding:10px 20px;font:650 15px Inter">${esc(s.p.button || "Connect")}</div></div></div>`, 440));
  },
  stat_floor(s) {
    mk("sf" + s.i, `<div style="width:2600px;height:5200px;background:repeating-linear-gradient(90deg,rgba(var(--accRGB),.16) 0 2px,transparent 2px 130px),repeating-linear-gradient(0deg,rgba(var(--accRGB),.10) 0 2px,transparent 2px 130px);-webkit-mask-image:radial-gradient(50% 50% at 50% 50%,#000 30%,transparent 75%)"></div>`);
    mk("sn" + s.i, `<div style="text-align:center;width:520px"><div style="font:850 ${String(s.p.value).length > 4 ? 140 : 190}px/1 Inter;letter-spacing:-.06em;color:var(--acc);text-shadow:0 0 60px rgba(var(--accRGB),.45)"><span class="v">0</span><span style="font-size:.58em">${esc(s.p.suffix || "")}</span></div>
      <div style="font:600 24px/1.3 Inter;color:var(--tx);margin-top:6px">${esc(s.p.caption || "")}<br><span style="color:var(--tx2)">${esc(s.p.sub || "")}</span></div>
      <div style="font:600 17px Inter;color:var(--tx2);margin-top:18px">${s.p.source ? "Source: " + esc(s.p.source) : ""}</div></div>`);
  },
  stat_wall(s) {
    const rows = (s.p.rows || []).slice(0, 14);
    mk("wl" + s.i, winHtml(s.p.wall_title || "", rows.map(r => `<div class="row" style="font:400 17px JBM"><span style="color:#6E7586">${esc(r[0])}</span><span style="flex:1;margin-left:16px;color:var(--tx2)">${esc(r[1])}</span><span style="color:var(--bad);font-weight:700">${esc(r[2] || "")}</span></div>`).join(""), 760));
    mk("wn" + s.i, `<div style="text-align:center;width:540px"><div style="font:850 ${String(s.p.value).length > 4 ? 130 : 170}px/1 Inter;letter-spacing:-.06em;color:#fff;text-shadow:0 10px 60px rgba(0,0,0,.95),0 0 40px rgba(248,81,73,.35)"><span class="v">0</span><span style="font-size:.6em;color:var(--bad)">${esc(s.p.suffix || "")}</span></div>
      <div style="font:600 24px/1.3 Inter;color:var(--tx);margin-top:8px;text-shadow:0 4px 24px #000">${esc(s.p.caption || "")}<br><span style="color:var(--tx2)">${esc(s.p.sub || "")}</span></div>
      <div style="font:600 17px Inter;color:var(--tx2);margin-top:18px;text-shadow:0 2px 10px #000">${s.p.source ? "Source: " + esc(s.p.source) : ""}</div></div>`);
  },
  cta_terminal(s) { mk("ct" + s.i, winHtml(s.p.title || "claude", `<div class="term" style="min-height:118px"><span class="p">&gt; </span><span class="ty"></span><span class="cur"></span><div class="res" style="color:var(--ok);margin-top:8px;font-size:14px"></div></div>`, 490)); },
  file_tree(s) {

    mk("ft" + s.i, winHtml(s.p.title || "project", `<div style="font:400 17px/2.1 JBM;padding:10px 18px;color:var(--tx2)">${f.map((x, j) => `<div class="fr" style="display:flex;justify-content:space-between;gap:12px;border-radius:9px;padding:0 10px;margin:0 -10px"><span style="color:${x[2] === "accent" ? "var(--acc)" : "var(--tx)"}">${esc(x[0])}</span><span style="color:${x[2] === "ok" ? "var(--ok)" : "var(--tx3)"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x[1] || "")}</span></div>`).join("")}

// ============================================================ camera + sound plan per scene type (seeded variation)

      case "app_window": { const fromLap = prev && prev.type === "laptop_prompt";

      case "diagram_link": go(0.8, cam(o, 0, 110, -60, -18 * sg, 10, 1150, 860)); key(t1, cam(o, 0, 120, -60, 12 * sg, 6, 1080, 860)); cue(t0, "whoosh"); break;
      case "door": { const a = W(s.line, s.p.word, 0.6); key(a + 0.2, cam(o, 0, 200, -60, 14 * sg, 8, 760)); key(t1, cam(o, 0, 120, -60, 12 * sg, 6, 1080, 860)); cue(a, "thump"); break; }

      case "code_card": cut(t0 - 0.1, camAtKeyLast(), cam(o, 0, 150, 170, -3 * sg, 2, 880)); key(t1 - 0.1, cam(o, 0, 150, 170, 4 * sg, 2, 900)); cue(t0 - 0.15, "pop"); (s.p.marks || []).forEach(m => cue(W(s.line, m.word, 0.5), "tick")); break;
      case "data_card": cut(t0 - 0.1, camAtKeyLast(), cam(o, 20, 150, 140, -22 * sg, 6, 780, 900, 1)); go(0.5, cam(o, 20, 130, 120, -12 * sg, 4, 700)); cue(t0 - 0.15, "pop"); for (let j = 0; j < 5; j++) cue(t0 - 0.1 + j * 0.12, "key", 0.4); if (s.p.fill) { cue(t0 + 0.75, "whoosh", 0.6); cue(t0 + 1.2, "ding"); } break;

      case "key_fly": { const a = W(s.line, s.p.word, 0.4); cut(a - 0.3, camAtKeyLast(), cam(o, -120 * sg, 160, 120, -30 * sg, -8, 620, 760, -3)); key(a + 0.5, cam(o, 40 * sg, 140, 20, -10 * sg, -2, 700, 820)); cue(a - 0.25, "whoosh"); cue(a + 0.3, "click"); break; }

      case "bullets": go(0.3, cam(o, 0, 0, 0, -10 * sg, 4, 980)); key(t1, cam(o, 0, 0, 0, 10 * sg, 4, 940)); (s.p.items || []).forEach((_, j) => cue(t0 + 0.2 + j * ((t1 - t0 - 0.4) / Math.max(1, (s.p.items || []).length)), "pop")); break;
