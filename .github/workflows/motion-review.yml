name: Motion review (approve or remake)

# For Tech Education videos held for review (label "review-motion", opened by "Make a motion video").
# Separate from "Review reply" (Hidden Reasons films): different label, different marker, no Kaggle.
# The owner comments on the issue:  approve  -> the pre-release becomes a finished release
#                                   remake   -> the episode is made again from its files on main
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: write   # to start "Make a motion video" for a remake

concurrency:
  group: motion-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reply:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'review-motion') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Read the reply and the issue
        id: what
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import os, re
          body, comment = os.environ["ISSUE_BODY"], os.environ["COMMENT"].strip().lower()
          m = re.search(r"<!-- motion-review: tag=(\S+) episode=(\S+) -->", body)
          word = "approve" if re.match(r"^\W*approve", comment) else "remake" if re.match(r"^\W*remake", comment) else ""
          ok = m and re.fullmatch(r"motion-[A-Za-z0-9._-]+", m.group(1)) and re.fullmatch(r"episodes/tech_education/[0-9]{3}-[a-z0-9-]+", m.group(2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"word={word if ok else ''}\n")
              if ok:
                  f.write(f"tag={m.group(1)}\nepisode={m.group(2)}\n")
          PY

      - name: Approve
        if: steps.what.outputs.word == 'approve'
        env:
          TAG: ${{ steps.what.outputs.tag }}
        run: |
          title=$(gh release view "$TAG" --json name --jq .name | sed 's/^REVIEW: //')
          gh release edit "$TAG" --prerelease=false --title "Motion: $title"
          gh issue comment "$ISSUE" --body "Approved: release **$TAG** is now finished."
          gh issue close "$ISSUE" --reason completed

      - name: Remake
        if: steps.what.outputs.word == 'remake'
        env:
          EP: ${{ steps.what.outputs.episode }}
        run: |
          gh workflow run make-motion.yml -f episode="$EP" -f topic=""
          gh issue comment "$ISSUE" --body "Making \`$EP\` again from its files on main. A new release (or a new review issue) will follow; this issue is closed."
          gh issue close "$ISSUE" --reason completed

      - name: Not understood
        if: steps.what.outputs.word == ''
        run: gh issue comment "$ISSUE" --body "I didn't understand that. Comment \`approve\` or \`remake\`."
