name: Lab (Kaggle GPU)

# Runs one experiment from lab/kaggle/<lab>/ on the owner's free Kaggle GPU and publishes what it made as a
# GitHub pre-release "lab-<lab>-run<N>". Free: GitHub Actions (public repo) + Kaggle's free weekly GPU hours.
on:
  push:
    branches: [lab-runs]       # pushing to this branch runs the lab named in lab/RUN (no change to main needed)
  workflow_dispatch:
    inputs:
      lab:
        description: "Lab folder name in lab/kaggle/ (e.g. visual_test1)"
        required: true
        default: "visual_test1"
      wait_minutes:
        description: "How long to wait for Kaggle (minutes)"
        required: false
        default: "200"

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Kaggle tool
        run: pip install -q -U kaggle six
      - name: Which lab
        run: |
          LAB="${{ github.event.inputs.lab }}"; [ -z "$LAB" ] && LAB=$(grep -v '^#' lab/RUN | tr -s '[:space:]' ',' | sed 's/,$//')
          WAIT="${{ github.event.inputs.wait_minutes }}"; [ -z "$WAIT" ] && WAIT=200
          echo "LAB=$LAB" >> "$GITHUB_ENV"; echo "WAIT=$WAIT" >> "$GITHUB_ENV"; echo "Lab: $LAB"
      - name: Run the lab on Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python lab/kaggle/run.py "$LAB" --wait-min "$WAIT"
      - name: Publish the results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la lab_publish 2>/dev/null || true
          files=$(find lab_publish -type f | head -400)
          [ -z "$files" ] && { echo "No output files."; exit 0; }
          tag="lab-run${{ github.run_number }}"
          gh release create "$tag" $files --prerelease --title "Lab: $LAB (run ${{ github.run_number }})" --notes "Experiment output, not a finished video."
      - name: Fail if a lab script crashed part-way
        if: always()
        run: if [ -f lab_publish/CRASHED.txt ]; then cat lab_publish/CRASHED.txt; exit 1; fi
