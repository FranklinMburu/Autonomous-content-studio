name: Lab ping (does a push from the sandbox start workflows?)
on:
  push:
    branches: ["lab/quick-ping"]
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > lab/ping.txt
          git config user.name "Franklin Mburu"; git config user.email "184284364+FranklinMburu@users.noreply.github.com"
          git add lab/ping.txt; git commit -m "ping [skip ci]"; git push
