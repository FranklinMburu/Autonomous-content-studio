name: Lab quick showcase (Kokoro backup voice + Three.js, fast, logs committed)
on:
  push:
    branches: ["lab/quick-*"]
    paths-ignore: ["lab/showcase/vendor/**", "lab/showcase/logs/**"]
permissions:
  contents: write
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vendor Three.js
        continue-on-error: true
        run: |
          mkdir -p lab/showcase/logs
          {
          set -x
          cd "$RUNNER_TEMP" && npm view three version && npm pack three@0.180.0 && tar xzf three-0.180.0.tgz && ls package/build
          V="$GITHUB_WORKSPACE/lab/showcase/vendor/three"; mkdir -p "$V/examples/jsm"
          cp package/build/three.module.min.js "$V/" ; cp package/build/three.core.min.js "$V/" ; cp package/build/three.module.js "$V/" ; cp package/build/three.core.js "$V/"
          cp package/LICENSE "$V/"
          for d in postprocessing shaders geometries environments utils math objects lines curves; do cp -r package/examples/jsm/$d "$V/examples/jsm/" ; done
          ls -la "$V"
          } > "$GITHUB_WORKSPACE/lab/showcase/logs/three.log" 2>&1
      - name: Kokoro voice (am_fenrir, the previous locked TE voice)
        continue-on-error: true
        run: |
          mkdir -p lab/showcase/logs lab/showcase/out
          {
          set -x
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install -q kokoro-onnx==0.6.1 "onnxruntime>=1.20" "soundfile>=0.12" "numpy>=1.26" scipy pillow requests
          python - <<'PY'
          import json, shutil, traceback
          from pathlib import Path
          from studio.motion.narrate import narrate
          cfg = json.load(open("channels/te/channel.json"))["voice"]["previous"]
          dst = Path("lab/showcase/audio"); dst.mkdir(parents=True, exist_ok=True)
          for ep in ["n1x", "cables"]:
              try:
                  s = json.load(open(f"lab/showcase/{ep}.json"))
                  k = Path("out") / (ep + "_kokoro"); k.mkdir(parents=True, exist_ok=True)
                  t = narrate(s, k, cfg)
                  shutil.copy(k / "voice.wav", dst / f"{ep}_kokoro.wav"); shutil.copy(k / "timing.json", dst / f"{ep}_kokoro.json")
                  print(ep, "kokoro OK", t["duration"])
              except Exception:
                  traceback.print_exc()
          PY
          } > lab/showcase/logs/voice.log 2>&1
      - name: Commit everything back (always)
        if: always()
        run: |
          git config user.name "Franklin Mburu"; git config user.email "184284364+FranklinMburu@users.noreply.github.com"
          git add -A -f lab/showcase/logs lab/showcase/audio lab/showcase/vendor || true
          git commit -m "lab quick showcase: results + logs [skip ci]" || true
          git pull --rebase -q || true
          git push
