name: Story schedule

# Starts one film-style Hidden Reasons video, 5 times a day (agreed with Franklin, 2 Nov), from
# episodes/hidden_reasons/topics.txt (new ideas are suggested automatically when fewer than 5 are left).
# Each start dispatches "Make a story video", which runs one at a time (its concurrency group), so the free
# Kaggle GPU (30 h/week; one video uses ~35 min) is never asked for two videos at once.
# Slots (UTC): 00:23, 05:23, 10:23, 17:23, 21:23  =  03:23, 08:23, 13:23, 20:23, 00:23 Nairobi.
# Self-healing (6 Nov fix): GitHub drops scheduled runs when it is busy (only ~2 of 5 fired on 3-5 Nov), so this
# wakes every hour and starts a film only if fewer films have started today than slots have passed (catch-up),
# never more than the 5 slots a day, never two waiting at once, never more than 36 a week.
# GitHub still ran the hourly timer only ~2 times a day, so the "Story clock" workflow now wakes this on time.
run-name: "${{ inputs.request_id && format('{0} [{1}]', github.workflow, inputs.request_id) || github.event.head_commit.message || github.workflow }}"
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      request_id:
        description: "Set by the Studio app to follow this run (leave empty)"
        required: false
        default: ""
      topic:
        description: "Optional: make this topic now instead of the next one in the queue"
        required: false
        default: ""
      catchup:
        description: "Used by the Story clock: start a film only if one is due (same guardrails as the timer)"
        required: false
        default: "false"

permissions:
  contents: write   # the channel memory (a release asset)
  actions: write    # to start "Make a story video"

concurrency:
  group: story-schedule
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the brain (for new topic ideas)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: FranklinMburu/AI-layer
          ssh-key: ${{ secrets.AILAYER_DEPLOY_KEY }}
          path: .brain
          persist-credentials: false

      - name: Guardrails (don't pile up, stay inside the free GPU week)
        id: guard
        run: |
          SLOTS="0 5 10 17 21"   # keep in step with the slot list at the top of this file
          busy=$(gh api "repos/${{ github.repository }}/actions/workflows/make-story.yml/runs?per_page=20" \
                 --jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length')
          today=$(date -u +%Y-%m-%d); hour=$((10#$(date -u +%H))); min=$((10#$(date -u +%M)))
          due=0; for h in $SLOTS; do if [ "$h" -lt "$hour" ] || { [ "$h" -eq "$hour" ] && [ "$min" -ge 23 ]; }; then due=$((due+1)); fi; done
          started=$(gh api "repos/${{ github.repository }}/actions/workflows/make-story.yml/runs?per_page=50&created=>=$today" \
                 --jq '[.workflow_runs[] | select(.event=="workflow_dispatch")] | length')
          week=$(gh api "repos/${{ github.repository }}/actions/workflows/make-story.yml/runs?per_page=100&created=>$(date -u -d '7 days ago' +%Y-%m-%d)" \
                 --jq '[.workflow_runs[] | select(.conclusion=="success")] | length')
          echo "running/queued: $busy; finished this week: $week; slots due today: $due; started today: $started"
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.catchup }}" = "true" ]; } && [ "$started" -ge "$due" ]; then echo "go=no" >> "$GITHUB_OUTPUT"; echo "On schedule: nothing to catch up."
          elif [ "$busy" -ge 2 ]; then echo "go=no" >> "$GITHUB_OUTPUT"; echo "Two videos already waiting: skipping this slot."
          elif [ "$week" -ge 36 ]; then echo "go=no" >> "$GITHUB_OUTPUT"; echo "36 videos this week (5 a day): saving the free GPU hours."
          else echo "go=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Pick the topic
        if: steps.guard.outputs.go == 'yes'
        env:
          TOPIC_IN: ${{ github.event.inputs.topic }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACCOUNT_KEY_franklincopil3: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AILAYER_STATE_URL: ${{ secrets.AILAYER_STATE_URL }}
          AILAYER_STATE_TOKEN: ${{ secrets.AILAYER_STATE_TOKEN }}
        run: |
          [ -f .brain/ailayer/__init__.py ] && export PYTHONPATH="$GITHUB_WORKSPACE/.brain"
          # pycairo (in requirements.txt) needs the cairo library: without it every run failed on 3-6 Nov
          sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2-dev pkg-config > /dev/null
          pip install -q -r requirements.txt
          gh release download channel-memory -p used.json -D . 2>/dev/null || echo '{"episodes": []}' > used.json
          if [ -n "$TOPIC_IN" ]; then topic="$TOPIC_IN"; else topic=$(python -m studio.story.topics next --memory used.json); fi
          [ -z "$topic" ] && { echo "No topics left."; exit 1; }
          gh release view channel-memory >/dev/null 2>&1 || gh release create channel-memory --prerelease --title "Channel memory" \
            --notes "What earlier videos used (cast, places, music, topics), so new stories don't repeat them. Updated by the pipeline."
          gh release upload channel-memory used.json --clobber
          echo "Topic: $topic" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run make-story.yml --ref "${{ github.ref_name }}" -f style=film -f topic="$topic"
