name: Claude clips, raw footage fetch (no AI)

# 21 Nov 2026 money/secret hunt (Clip Room loop). 19 Nov 2026, Franklin: his pipeline is paused; Claude makes the GTA 6 Shorts by hand. GitHub only fetches footage
# (YouTube/Twitch/Kick are unreachable from Claude's workspace): the most fan-clipped moments, ~2 min of 1080p each,
# plus a word-level transcript. Results are a workflow artifact, not a public release.
on:
  push:
    branches: ["claude-clips/**"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: d3-kaicenat
            args: twitch --channel kaicenat --title-re "money|cash|\\$|stash|secret|hidden|easter|glitch|parrot|free|rich|million|tip|trick|found|finds|discover|rob|heist|safe|bank|fleeca|bigfoot|ufo|ghost|alien|niko|gta 5|gta v|realistic|didn.t know|you can|save|progress|lost" --top 6 --use-clips --to-s 1e13
          - name: d3-lacy
            args: twitch --channel lacy --title-re "money|cash|\\$|stash|secret|hidden|easter|glitch|parrot|free|rich|million|tip|trick|found|finds|discover|rob|heist|safe|bank|fleeca|bigfoot|ufo|ghost|alien|niko|gta 5|gta v|realistic|didn.t know|you can|save|progress|lost" --top 6 --use-clips --to-s 1e13
