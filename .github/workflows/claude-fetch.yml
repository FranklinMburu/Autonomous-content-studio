          - name: d3-zackrawrr
            args: twitch --channel zackrawrr --title-re "money|cash|\\$|stash|secret|hidden|easter|glitch|parrot|free|rich|million|tip|trick|found|finds|discover|rob|heist|safe|bank|fleeca|bigfoot|ufo|ghost|alien|niko|gta 5|gta v|realistic|didn.t know|you can|save|progress|lost" --top 6 --use-clips --to-s 1e13
          - name: d3-sodapoppin
            args: twitch --channel sodapoppin --title-re "money|cash|\\$|stash|secret|hidden|easter|glitch|parrot|free|rich|million|tip|trick|found|finds|discover|rob|heist|safe|bank|fleeca|bigfoot|ufo|ghost|alien|niko|gta 5|gta v|realistic|didn.t know|you can|save|progress|lost" --top 6 --use-clips --to-s 1e13
          - name: d3-tarik
            args: twitch --channel tarik --title-re "money|cash|\\$|stash|secret|hidden|easter|glitch|parrot|free|rich|million|tip|trick|found|finds|discover|rob|heist|safe|bank|fleeca|bigfoot|ufo|ghost|alien|niko|gta 5|gta v|realistic|didn.t know|you can|save|progress|lost" --top 6 --use-clips --to-s 1e13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-v1
      - name: Tools
        run: |
          for i in 1 2; do timeout 180 sh -c 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null' && break; done
          pip install -q "yt-dlp==2026.10.26" faster-whisper
      - name: Fetch
        run: python lab/claude_clips/fetch.py ${{ matrix.args }} --out out
      - name: Footage to branch footage/<name> (Claude's workspace reads git only)
        run: |
          cd out && for f in *.mp4; do [ -e "$f" ] && [ $(stat -c%s "$f") -gt 95000000 ] && ffmpeg -v error -y -i "$f" -c:v libx264 -preset veryfast -crf 24 -maxrate 4M -bufsize 8M -c:a copy "s_$f" && mv "s_$f" "$f"; done; ls -la
          git init -q -b "footage/${{ matrix.name }}" && git add . && git -c user.name="Franklin Mburu" -c user.email="184284364+FranklinMburu@users.noreply.github.com" commit -qm "footage ${{ matrix.name }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "footage/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-${{ matrix.name }}
          path: out/
          retention-days: 7
