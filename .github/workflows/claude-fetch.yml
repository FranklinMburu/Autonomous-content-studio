name: Claude clips, raw footage fetch (no AI)

# 19 Nov 2026, Franklin: his pipeline is paused; Claude makes the GTA 6 Shorts by hand. GitHub only fetches footage
# (YouTube/Twitch/Kick are unreachable from Claude's workspace): the most fan-clipped moments, ~2 min of 1080p each,
# plus a word-level transcript. Results are a workflow artifact, not a public release.
on:
  push:
    branches: ["claude-clips/**"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fanum
            args: twitch --vod https://www.twitch.tv/videos/2932675314 --channel fanum --top 7
          - name: agent00
            args: twitch --vod https://www.twitch.tv/videos/2932265940 --channel agent00 --top 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-v1
      - name: Tools
        run: |
          for i in 1 2; do timeout 180 sh -c 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null' && break; done
          pip install -q "yt-dlp==2026.10.26" faster-whisper
      - name: Fetch
        run: python lab/claude_clips/fetch.py ${{ matrix.args }} --out out
      - name: Footage to branch footage/<name> (Claude's workspace reads git only)
        run: |
          cd out && for f in *.mp4; do [ $(stat -c%s "$f") -gt 95000000 ] && ffmpeg -v error -y -i "$f" -c:v libx264 -preset veryfast -crf 24 -maxrate 4M -bufsize 8M -c:a copy "s_$f" && mv "s_$f" "$f"; done; ls -la
          git init -q -b "footage/${{ matrix.name }}" && git add . && git -c user.name="Franklin Mburu" -c user.email="184284364+FranklinMburu@users.noreply.github.com" commit -qm "footage ${{ matrix.name }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "footage/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-${{ matrix.name }}
          path: out/
          retention-days: 7
