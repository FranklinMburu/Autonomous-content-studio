name: Clips, who's hot today

# Who to clip today, from real numbers (clipit's idea, extended): Kick streamers ranked by the views on their clips of
# the last day, the biggest Kick live streams, and what the top clip channels posted in the last days with their views.
# Read-only: public pages and Kick's own website API, no keys. Results are printed to the log.
run-name: "${{ inputs.request_id && format('{0} [{1}]', github.workflow, inputs.request_id) || github.event.head_commit.message || github.workflow }}"
on:
  push:
    branches: ["clips-hot/**"]
  workflow_dispatch:
    inputs:
      request_id:
        description: "Set by the Studio app to follow this run (leave empty)"
        required: false
        default: ""

permissions:
  contents: write   # the clips-hot release (latest lists for the Studio app)

jobs:
  hot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Streamers lane
        run: |
          pip install -q "yt-dlp==2026.10.26"
          python -m studio.clips.hot streamers --out hot_streamers.json
      - name: World lane
        run: python -m studio.clips.hot world --out hot_world.json --topics 25
      - name: Today's picks onto the Studio Board (Notion)
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python -m studio.clips.board picks --lane SC --file hot_streamers.json --top 5
          python -m studio.clips.board picks --lane WC --file hot_world.json --top 5
      - uses: actions/upload-artifact@v4
        with:
          name: hot
          path: hot_*.json
      - name: Keep the latest lists for the Studio app (release "clips-hot", replaced each run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view clips-hot > /dev/null 2>&1 || gh release create clips-hot --prerelease --title "Who's hot: the latest lists" \
            --notes "Written by the 'Clips, who's hot today' workflow each run. The Studio app reads these two files. Not videos."
          gh release upload clips-hot hot_streamers.json hot_world.json --clobber
