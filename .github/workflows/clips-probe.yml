name: Clips probe (what GitHub can reach without downloading whole streams)

# 19 Nov 2026: where in Kai Cenat's GTA 6 marathon VOD do fans clip? (picks the 6 h window for the stream chain)
on:
  push:
    branches: ["clips-probe/**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kick clip fields
        run: |
          for ch in n3on adinross; do
            curl -sS -m 20 -A "Mozilla/5.0" "https://kick.com/api/v2/channels/$ch/clips?sort=view&time=day" -o c.json
            python3 -c "
          import json; d = json.load(open('c.json')); c = d.get('clips', d) if isinstance(d, dict) else d
          for x in c[:6]:
              print('CLIP', {k: x.get(k) for k in ('id','title','view_count','duration','created_at','started_at','vod_starts_at','livestream_id','clip_url','video_url')})
          print('VODKEYS')
          "
            curl -sS -m 20 -A "Mozilla/5.0" "https://kick.com/api/v2/channels/$ch/videos" | python3 -c "
          import json,sys; v=json.load(sys.stdin)[:3]
          for x in v: print('VOD', {k: x.get(k) for k in ('id','start_time','duration','created_at','session_title')}, (x.get('video') or {}).get('id'), (x.get('video') or {}).get('uuid'))
          "
          done
