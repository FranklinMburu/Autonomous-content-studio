name: Clips probe (what GitHub can reach without downloading whole streams)

# 19 Nov 2026: where in Kai Cenat's GTA 6 marathon VOD do fans clip? (picks the 6 h window for the stream chain)
on:
  push:
    branches: ["clips-probe/**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kai fan clips on the GTA 6 VOD
        run: |
          pip install -q "yt-dlp==2026.10.26"
          python3 - <<'PY'
          import json, subprocess
          from concurrent.futures import ThreadPoolExecutor
          vurl = "https://www.twitch.tv/videos/2932305259"
          vt = json.loads(subprocess.run(["yt-dlp", "-J", "--skip-download", vurl], capture_output=True, text=True).stdout or "{}")
          t0, dur = vt.get("timestamp") or 0, vt.get("duration") or 0
          print("VOD", vt.get("title"), "start", t0, "duration h", round(dur / 3600, 2), "live", vt.get("is_live"))
          urls = subprocess.run(["yt-dlp", "--flat-playlist", "--playlist-end", "100", "--print", "%(url)s",
                                 "https://www.twitch.tv/kaicenat/clips?filter=clips&range=7d"], capture_output=True, text=True).stdout.split()
          def info(u):
              return json.loads(subprocess.run(["yt-dlp", "-J", "--skip-download", u], capture_output=True, text=True).stdout or "{}")
          with ThreadPoolExecutor(12) as ex:
              ds = list(ex.map(info, urls))
          key = []
          for u, d in zip(urls, ds):
              ts = d.get("timestamp") or 0
              if t0 and t0 <= ts <= t0 + dur + 600:
                  key.append((d.get("view_count") or 0, round(ts - t0 - (d.get("duration") or 30)), d.get("title"), u))
          key.sort(reverse=True)
          print("fan clips in this VOD:", len(key), "of", len(urls))
          for v, off, t, u in key[:40]:
              print(f"CLIP {v:>8} views @ {off//3600}:{off%3600//60:02d}:{off%60:02d} ({off} s)  {t[:70]}")
          for h in range(0, int(dur // 3600) + 1):
              s = sum(v for v, off, *_ in key if h * 3600 <= off < h * 3600 + 3600)
              print(f"HOUR {h:>2}: {s} views")
          PY
