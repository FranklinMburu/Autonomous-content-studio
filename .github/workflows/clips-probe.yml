name: Clips probe (what GitHub can reach without downloading whole streams)

# 19 Nov 2026: GTA 6 launch day. List the newest VODs (title, category, length, live or not) of the known streamers
# allowed for the GTA window, so the stream chain can be pointed at real launch streams. Nothing is downloaded.
on:
  push:
    branches: ["clips-probe/**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: GTA launch VODs
        run: |
          pip install -q "yt-dlp==2026.10.26"
          for ch in kaicenat jynxzi caseoh plaqueboymax lacy fanum dukedennis agent00 ludwig; do
            echo "== TWITCH $ch"
            timeout 60 yt-dlp --flat-playlist -I 1:3 --print "%(id)s | %(title).90s | %(duration)s s | live=%(is_live)s | %(timestamp)s" "https://www.twitch.tv/$ch/videos?filter=archives&sort=time" 2>&1 | tail -4
          done
          for ch in xqc n3on adinross deshaefrost jaycinco sneako cuffem notquitelikedub jackdoherty iceposeidon; do
            echo "== KICK $ch"
            curl -sS -m 20 -A "Mozilla/5.0" "https://kick.com/api/v2/channels/$ch/videos" -o v.json
            python3 -c "
          import json
          try: d = json.load(open('v.json'))
          except Exception as e: print('  unreadable', e); raise SystemExit
          for v in (d if isinstance(d, list) else d.get('data', []))[:3]:
              cats = ','.join(c.get('name', '') for c in (v.get('categories') or []))
              print(' ', (v.get('video') or {}).get('uuid'), '|', (v.get('session_title') or '')[:90], '|', cats, '|', round((v.get('duration') or 0)/3600000, 1), 'h | live=', v.get('is_live'), '|', v.get('start_time'))
          "
          done
