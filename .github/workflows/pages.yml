name: Website (GitHub Pages)

# Builds the Candela website (web/) and publishes it on GitHub Pages:
#   https://franklinmburu.github.io/Autonomous-content-studio/
# Runs when the website changes on main, or by hand. Free (public repo). The site itself has no server: the browser
# reads the live data from this repo (feed.json on the site-data branch, else the public GitHub API).
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # to publish
  id-token: write   # Pages checks the publish really comes from this workflow

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build (under /<repo>/, the address GitHub Pages gives a project site)
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npx tsc --noEmit
          npx vite build
          # GitHub Pages has no "send every address to index.html" setting: its 404 page is the app itself, so
          # links like /app/films work when opened directly or reloaded
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
