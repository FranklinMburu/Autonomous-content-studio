name: Claude TTS (narration for Shorts)
on:
  push:
    branches: ["claude-tts/**"]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with: {path: cache, key: claude-tts-kokoro-v1}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
      - run: pip install -q kokoro-onnx==0.6.1 soundfile numpy
      - run: python lab/claude_tts/run.py
      - name: Push the result to tts-out/<name>
        run: |
          N=$(jq -r .name lab/claude_tts/script.json)
          cd out && git init -q && git checkout -q -b "tts-out/$N"
          git config user.name "Franklin Mburu"; git config user.email "184284364+FranklinMburu@users.noreply.github.com"
          git add . && git commit -qm "tts $N"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "tts-out/$N"
