name: Clips, viewer panel check

# 16 Nov 2026 (Clipping Lab #3b): does the viewer panel agree with Franklin's keeps and skips on the Studio Board?
# Read-only: downloads the labelled Shorts from their releases, runs the reviewer with the viewer panel, prints AUC.
on:
  push:
    branches: ["clips-viewer/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab/clips/requirements-shorts.txt
      - name: Tools
        run: |
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          pip install -q -r lab/clips/requirements-shorts.txt
      - name: Download the labelled Shorts
        run: |
          mkdir -p clips
          python3 -c "import json; [print(l['tag'], l['id']) for l in json.load(open('lab/clips/viewer_labels.json'))]" | while read t id; do
            gh release download "$t" -R "$R" -p "$id.mp4" -D clips --clobber || echo "missing $id"
          done
          ls clips | wc -l
      - name: Viewer panel vs Franklin
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python lab/clips/viewer_calib.py --labels lab/clips/viewer_labels.json --dir clips
