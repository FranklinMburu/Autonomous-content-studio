name: "Pipeline self-test (branch only, temporary)"
# Nightly: research real sources, write grounded drafts with free models, check them, queue them for polish.
# 00:13 UTC = 03:13 Nairobi. Run by hand: Actions -> "Pipeline 1: draft" -> Run workflow.
on:
  push:
    branches: [studio-pipeline]
    paths: [".github/workflows/pipeline-selftest.yml"]
  workflow_dispatch:
    inputs:
      topic:
        description: "Draft this topic now (empty = next topics from topics.txt)"
        required: false
        default: ""
      count:
        description: "How many topics (empty = config)"
        required: false
        default: ""
permissions:
  contents: write
  issues: write
concurrency:
  group: pipeline-selftest
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACCOUNT_KEY_franklincopil3: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      AILAYER_STATE_URL: ${{ secrets.AILAYER_STATE_URL }}
      AILAYER_STATE_TOKEN: ${{ secrets.AILAYER_STATE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Get the brain (private repo, read-only deploy key)
        uses: actions/checkout@v5
        with:
          repository: FranklinMburu/AI-layer
          ssh-key: ${{ secrets.AILAYER_DEPLOY_KEY }}
          path: .brain
          persist-credentials: false
      - run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.brain:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore icons
        uses: actions/cache@v4
        with:
          path: cache
          key: assets-kokoro-v1.1-tabler-3.49.0
      - name: Draft
        env:
          PIPELINE_BRANCH: studio-pipeline
        run: |
          set -o pipefail
          python -m studio.pipeline draft --topic "Why do we get goosebumps?" 2>&1 | tee -a pipeline.log
      - name: Show the log on the Summary page
        if: always()
        run: |
          if [ -f pipeline.log ]; then
            { echo '### Pipeline log (last 200 lines)'; echo '```'; tail -n 200 pipeline.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
