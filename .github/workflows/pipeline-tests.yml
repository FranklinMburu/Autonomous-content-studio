name: "Pipeline tests"
# Offline tests on every push: no keys, no network, no quota.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tests/test_pipeline.py
      - run: python tests/test_pipeline_fixes.py
      - name: Story style tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2-dev pkg-config ffmpeg > /dev/null
          pip install -q pycairo numpy pyflakes
          python tests/test_story.py
          python tests/test_story_writer.py
