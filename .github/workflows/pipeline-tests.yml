name: "Pipeline tests"
# Offline tests on every push: no keys, no network, no quota.
on:
  push:
    branches: [main]   # pull requests are tested by the pull_request trigger (no duplicate run per push)
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tests/test_pipeline.py
      - run: python tests/test_pipeline_fixes.py
      - run: python tests/test_git_identity.py
      - name: Story style tests
        run: |
          # fast install: skip man-page indexing and service-restart checks (they made this step hang for 10 min)
          sudo rm -f /var/lib/man-db/auto-update; echo '$nrconf{restart} = "l";' | sudo tee /etc/needrestart/conf.d/ci.conf > /dev/null 2>&1 || true
          # a slow Ubuntu mirror can stall apt: give it 3 minutes, then try once more instead of hanging to the limit
          for i in 1 2; do timeout 180 sh -c 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libcairo2-dev pkg-config ffmpeg > /dev/null' && break; echo "apt try $i was slow, retrying"; done
          pip install -q pycairo numpy pyflakes
          python tests/test_story.py
          python tests/test_story_writer.py
          python tests/test_film_queue.py
      - name: Workflow and polish-ticket checks (would have caught the 3-6 Nov schedule failure)
        run: |
          pip install -q pyyaml
          python tests/test_workflows.py

  motion:
    # Tech Education motion engine: plan contract, seeded style, offline writer, and a real render smoke test
    # (same inputs -> same frames). Separate job: it can't slow down or break the story tests.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/motion/package-lock.json
      - run: pip install -q numpy pillow
      - run: cd studio/motion && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: python tests/test_motion.py

  clips:
    # Clipping engine (studio/clips): rights, chat readers, moment finder, edit list, captions sync, a real render
    # (same inputs -> same frames) and the isolation checks. Separate job: it can't slow down or break the others.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          sudo rm -f /var/lib/man-db/auto-update; echo '$nrconf{restart} = "l";' | sudo tee /etc/needrestart/conf.d/ci.conf > /dev/null 2>&1 || true
          for i in 1 2; do timeout 180 sh -c 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg tesseract-ocr > /dev/null' && break; echo "apt try $i was slow, retrying"; done
          pip install -q numpy pillow soundfile "opencv-python-headless==4.10.0.84"
      - run: python tests/test_clips.py
